<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#fffdf7"/>
  <g transform="translate(85,160)">
    <rect width="300" height="180" rx="4" fill="#fff5e8" stroke="#c96e13" stroke-width="4"/>
    <text x="28" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#333">Bara en LED lyser?</text>
    <circle cx="90" cy="95" r="26" fill="#ff4a4a" stroke="#9d2323" stroke-width="4"/>
    <circle cx="160" cy="95" r="26" fill="#eee" stroke="#777" stroke-width="4"/>
    <text x="28" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Kontrollera den släckta LED-lampans</text>
    <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">riktning och GPIO-kabel.</text>
  </g>
  <g transform="translate(450,160)">
    <rect width="300" height="180" rx="4" fill="#fff5e8" stroke="#c96e13" stroke-width="4"/>
    <text x="28" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#333">Båda lyser?</text>
    <circle cx="90" cy="95" r="26" fill="#ff4a4a" stroke="#9d2323" stroke-width="4"/>
    <circle cx="160" cy="95" r="26" fill="#ffd34d" stroke="#ad7a00" stroke-width="4"/>
    <text x="28" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Läs digitalWrite-raderna.</text>
    <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Ska en vara HIGH och en LOW?</text>
  </g>
  <g transform="translate(815,160)">
    <rect width="300" height="180" rx="4" fill="#fff5e8" stroke="#c96e13" stroke-width="4"/>
    <text x="28" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#333">Motstånd?</text>
    <rect x="55" y="75" width="80" height="45" rx="10" fill="#d8b18b" stroke="#885f3c" stroke-width="3"/>
    <rect x="165" y="75" width="80" height="45" rx="10" fill="#d8b18b" stroke="#885f3c" stroke-width="3"/>
    <text x="28" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Varje LED ska ha ett eget</text>
    <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">motstånd till GND.</text>
  </g>
  <g transform="translate(210,420)">
    <rect width="780" height="140" rx="14" fill="#eaf7f0" stroke="#2f8a68" stroke-width="4"/>
    <text x="35" y="45" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#333">Bra ordning</text>
    <text x="35" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">1. Kontrollera LED 1: GPIO 23 → långt ben → kort ben → motstånd → GND.</text>
    <text x="35" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">2. Kontrollera LED 2: GPIO 22 → långt ben → kort ben → motstånd → GND.</text>
  </g>
</svg>

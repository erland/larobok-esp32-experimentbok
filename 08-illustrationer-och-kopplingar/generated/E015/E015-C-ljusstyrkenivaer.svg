<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <rect width="1280" height="520" fill="#fffdf7"/>
  <style>
    .panel{fill:#f5f9fc;stroke:#1f6b90;stroke-width:4}
    .box{fill:#ffffff;stroke:#1f6b90;stroke-width:3}
    .t{font-family:Arial, Helvetica, sans-serif;fill:#222}
    .h{font-size:30px;font-weight:700}
    .s{font-size:22px;fill:#444}
    .small{font-size:18px;fill:#555}
    .code{font-family:DejaVu Sans Mono, monospace;font-size:20px;fill:#222}
    .arrow{stroke:#ad7a00;stroke-width:5;fill:none;stroke-linecap:round}
    .arrowhead{fill:#ad7a00}
  </style>
  <g transform="translate(70,55)">
    <rect class="panel" x="0" y="0" width="1140" height="410" rx="18"/>
    <text class="t h" x="36" y="50">Samma LED i olika ljusstyrka</text>
    <text class="t small" x="36" y="84">Det är samma lampa – bara talet ändras.</text>

    <g transform="translate(120,145)">
      <g transform="translate(0,0)">
        <rect class="box" x="0" y="0" width="170" height="170" rx="14"/>
        <circle cx="85" cy="62" r="34" fill="#dddddd" stroke="#777" stroke-width="4"/>
        <text class="t s" x="60" y="120">Av</text>
        <text class="code" x="63" y="150">0</text>
      </g>
      <g transform="translate(230,0)">
        <rect class="box" x="0" y="0" width="170" height="170" rx="14"/>
        <circle cx="85" cy="62" r="34" fill="#ffb5b5" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="55" y="120">Svag</text>
        <text class="code" x="57" y="150">40</text>
      </g>
      <g transform="translate(460,0)">
        <rect class="box" x="0" y="0" width="170" height="170" rx="14"/>
        <circle cx="85" cy="62" r="34" fill="#ff7777" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="42" y="120">Mellan</text>
        <text class="code" x="50" y="150">140</text>
      </g>
      <g transform="translate(690,0)">
        <rect class="box" x="0" y="0" width="170" height="170" rx="14"/>
        <circle cx="85" cy="62" r="34" fill="#ff4a4a" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="53" y="120">Stark</text>
        <text class="code" x="50" y="150">255</text>
      </g>

      <path class="arrow" d="M172 62 H220"/>
      <polygon class="arrowhead" points="220,62 208,56 208,68"/>
      <path class="arrow" d="M402 62 H450"/>
      <polygon class="arrowhead" points="450,62 438,56 438,68"/>
      <path class="arrow" d="M632 62 H680"/>
      <polygon class="arrowhead" points="680,62 668,56 668,68"/>
    </g>

    <text class="t small" x="392" y="370">Högre tal gör ljuset starkare.</text>
  </g>
</svg>

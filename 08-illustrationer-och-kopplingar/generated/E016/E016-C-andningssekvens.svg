<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <rect width="1280" height="560" fill="#fffdf7"/>
  <style>
    .panel{fill:#f5f9fc;stroke:#1f6b90;stroke-width:4}
    .box{fill:#ffffff;stroke:#1f6b90;stroke-width:3}
    .t{font-family:Arial, Helvetica, sans-serif;fill:#222}
    .h{font-size:30px;font-weight:700}
    .s{font-size:22px;fill:#444}
    .small{font-size:18px;fill:#555}
    .arrow{stroke:#ad7a00;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrowhead{fill:#ad7a00}
  </style>
  <g transform="translate(70,55)">
    <rect class="panel" x="0" y="0" width="1140" height="450" rx="18"/>
    <text class="t h" x="36" y="50">Ljuset växer och minskar</text>
    <text class="t small" x="36" y="84">Många små steg kan kännas som andning.</text>

    <g transform="translate(110,155)">
      <g transform="translate(0,0)">
        <rect class="box" x="0" y="0" width="155" height="170" rx="14"/>
        <circle cx="78" cy="65" r="30" fill="#dddddd" stroke="#777" stroke-width="4"/>
        <text class="t s" x="54" y="125">Av</text>
        <text class="t small" x="61" y="150">0</text>
      </g>
      <g transform="translate(205,0)">
        <rect class="box" x="0" y="0" width="155" height="170" rx="14"/>
        <circle cx="78" cy="65" r="30" fill="#ffb5b5" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="48" y="125">Svag</text>
        <text class="t small" x="56" y="150">60</text>
      </g>
      <g transform="translate(410,0)">
        <rect class="box" x="0" y="0" width="155" height="170" rx="14"/>
        <circle cx="78" cy="65" r="30" fill="#ff7777" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="37" y="125">Mellan</text>
        <text class="t small" x="50" y="150">150</text>
      </g>
      <g transform="translate(615,0)">
        <rect class="box" x="0" y="0" width="155" height="170" rx="14"/>
        <circle cx="78" cy="65" r="30" fill="#ff4a4a" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="46" y="125">Stark</text>
        <text class="t small" x="50" y="150">255</text>
      </g>
      <g transform="translate(820,0)">
        <rect class="box" x="0" y="0" width="155" height="170" rx="14"/>
        <circle cx="78" cy="65" r="30" fill="#ffb5b5" stroke="#9d2323" stroke-width="4"/>
        <text class="t s" x="48" y="125">Svag</text>
        <text class="t small" x="56" y="150">60</text>
      </g>

      <path class="arrow" d="M157 65 H197"/>
      <polygon class="arrowhead" points="197,65 185,59 185,71"/>
      <path class="arrow" d="M362 65 H402"/>
      <polygon class="arrowhead" points="402,65 390,59 390,71"/>
      <path class="arrow" d="M567 65 H607"/>
      <polygon class="arrowhead" points="607,65 595,59 595,71"/>
      <path class="arrow" d="M772 65 H812"/>
      <polygon class="arrowhead" points="812,65 800,59 800,71"/>
    </g>

    <path class="arrow" d="M990 278 C1052 318 1035 382 880 392 L285 392 C145 392 132 318 178 285"/>
    <polygon class="arrowhead" points="178,285 192,279 189,294"/>
    <text class="t small" x="455" y="425">Sedan börjar ljuset om.</text>
  </g>
</svg>

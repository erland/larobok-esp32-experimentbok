<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <rect width="1280" height="560" fill="#fffdf7"/>
  <style>
    .panel{fill:#f5f9fc;stroke:#1f6b90;stroke-width:4}
    .box{fill:#ffffff;stroke:#1f6b90;stroke-width:3}
    .t{font-family:Arial, Helvetica, sans-serif;fill:#222}
    .h{font-size:30px;font-weight:700}
    .s{font-size:22px;fill:#444}
    .small{font-size:18px;fill:#555}
    .note{font-size:20px;font-weight:700;fill:#333}
  </style>

  <g transform="translate(70,55)">
    <rect class="panel" x="0" y="0" width="1140" height="450" rx="18"/>
    <text class="t h" x="36" y="50">Färg kan vara ett litet meddelande</text>
    <text class="t small" x="36" y="84">Många prylar använder färg för att visa läge eller status.</text>

    <g transform="translate(85,145)">
      <rect class="box" x="0" y="0" width="225" height="200" rx="16"/>
      <circle cx="70" cy="65" r="34" fill="#45c86b" stroke="#237a34" stroke-width="4"/>
      <text class="t note" x="122" y="56">Grön</text>
      <text class="t s" x="122" y="92">allt okej</text>
      <text class="t small" x="36" y="148">Lampan säger:</text>
      <text class="t note" x="36" y="178">fortsätt</text>
    </g>

    <g transform="translate(335,145)">
      <rect class="box" x="0" y="0" width="225" height="200" rx="16"/>
      <circle cx="70" cy="65" r="34" fill="#ffd34d" stroke="#ad7a00" stroke-width="4"/>
      <text class="t note" x="122" y="56">Gul</text>
      <text class="t s" x="122" y="92">vänta</text>
      <text class="t small" x="36" y="148">Lampan säger:</text>
      <text class="t note" x="36" y="178">titta hit</text>
    </g>

    <g transform="translate(585,145)">
      <rect class="box" x="0" y="0" width="225" height="200" rx="16"/>
      <circle cx="70" cy="65" r="34" fill="#ff4a4a" stroke="#9d2323" stroke-width="4"/>
      <text class="t note" x="122" y="56">Röd</text>
      <text class="t s" x="122" y="92">varning</text>
      <text class="t small" x="36" y="148">Lampan säger:</text>
      <text class="t note" x="36" y="178">stanna</text>
    </g>

    <g transform="translate(835,145)">
      <rect class="box" x="0" y="0" width="225" height="200" rx="16"/>
      <circle cx="70" cy="65" r="34" fill="#4d90ff" stroke="#2467c2" stroke-width="4"/>
      <text class="t note" x="122" y="56">Blå</text>
      <text class="t s" x="122" y="92">lugn</text>
      <text class="t small" x="36" y="148">Lampan säger:</text>
      <text class="t note" x="36" y="178">ta det lugnt</text>
    </g>

    <text class="t small" x="355" y="405">Färger betyder inte alltid samma sak – men de kan hjälpa oss förstå snabbt.</text>
  </g>
</svg>

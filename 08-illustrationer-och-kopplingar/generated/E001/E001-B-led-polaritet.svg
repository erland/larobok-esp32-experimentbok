<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:32px;font-weight:bold;fill:#1F5F8B}
    .label{font-family:Arial,sans-serif;font-size:22px;fill:#222}
    .small{font-family:Arial,sans-serif;font-size:17px;fill:#555}
    .call{fill:#EAF4FA;stroke:#1F5F8B;stroke-width:3;rx:14}
  </style>
  <circle cx="450" cy="235" r="90" fill="#ff4d4d" stroke="#9b2226" stroke-width="6"/>
  <path d="M390 245 Q450 150 510 245" fill="none" stroke="#ffb3b3" stroke-width="12" opacity="0.7"/>
  <line x1="410" y1="320" x2="385" y2="475" stroke="#777" stroke-width="8"/>
  <line x1="490" y1="320" x2="525" y2="500" stroke="#777" stroke-width="8"/>
  <line x1="525" y1="500" x2="525" y2="525" stroke="#777" stroke-width="8"/>
  <rect x="70" y="350" width="270" height="110" class="call"/>
  <text x="95" y="392" class="label">Kort ben</text>
  <text x="95" y="424" class="small">går mot motstånd och GND</text>
  <path d="M340 405 L390 405" stroke="#1F5F8B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="560" y="355" width="270" height="120" class="call"/>
  <text x="585" y="397" class="label">Långt ben</text>
  <text x="585" y="429" class="small">går mot GPIO 23</text>
  <path d="M560 420 L520 420" stroke="#1F5F8B" stroke-width="4" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:34px;font-weight:bold;fill:#1F5F8B}
    .label{font-family:Arial,sans-serif;font-size:21px;font-weight:bold;fill:#222}
    .small{font-family:Arial,sans-serif;font-size:16px;fill:#555}
    .card{fill:#fff8f0;stroke:#B85C00;stroke-width:3;rx:18}
    .ok{fill:#eaf7f1;stroke:#2E7D61;stroke-width:3;rx:18}
    .x{stroke:#B85C00;stroke-width:8;stroke-linecap:round}
  </style>
  <text x="55" y="65" class="title">Vanliga ledtrådar</text>
  <text x="55" y="98" class="small">Om lampan inte blinkar: undersök en ledtråd i taget.</text>

  <rect x="70" y="145" width="300" height="210" class="card"/>
  <text x="95" y="185" class="label">LED åt andra hållet?</text>
  <circle cx="220" cy="250" r="38" fill="#ff4d4d" stroke="#9b2226" stroke-width="4"/>
  <line x1="245" y1="285" x2="285" y2="335" stroke="#777" stroke-width="6"/>
  <line x1="195" y1="285" x2="165" y2="315" stroke="#777" stroke-width="6"/>
  <line x1="145" y1="210" x2="295" y2="335" class="x"/>
  <line x1="295" y1="210" x2="145" y2="335" class="x"/>
  <text x="95" y="333" class="small">Vänd LED-lampan och testa igen.</text>

  <rect x="405" y="145" width="300" height="210" class="card"/>
  <text x="430" y="185" class="label">Båda benen i samma rad?</text>
  <rect x="470" y="220" width="170" height="80" fill="#f1f1f1" stroke="#ccc" stroke-width="2" rx="8"/>
  <circle cx="520" cy="260" r="6" fill="#aaa"/><circle cx="560" cy="260" r="6" fill="#aaa"/><circle cx="600" cy="260" r="6" fill="#aaa"/>
  <line x1="535" y1="210" x2="535" y2="260" stroke="#777" stroke-width="6"/>
  <line x1="560" y1="210" x2="560" y2="260" stroke="#777" stroke-width="6"/>
  <line x1="455" y1="210" x2="655" y2="315" class="x"/>
  <line x1="655" y1="210" x2="455" y2="315" class="x"/>
  <text x="430" y="333" class="small">LED-benen ska sitta på olika rader.</text>

  <rect x="740" y="145" width="300" height="210" class="card"/>
  <text x="765" y="185" class="label">Annan GPIO?</text>
  <rect x="800" y="225" width="170" height="95" fill="#2d6a4f" stroke="#1b4332" stroke-width="4" rx="12"/>
  <rect x="935" y="242" width="58" height="30" fill="#f28c28" rx="5"/>
  <text x="944" y="263" class="small" fill="#fff">23</text>
  <path d="M765 330 C830 285 895 270 935 257" stroke="#f28c28" stroke-width="7" fill="none"/>
  <text x="765" y="333" class="small">Koden använder GPIO 23.</text>

  <rect x="240" y="420" width="620" height="170" class="ok"/>
  <text x="280" y="470" class="label">Bra felsökningsregel</text>
  <text x="280" y="510" class="small">Ändra inte allt på en gång.</text>
  <text x="280" y="540" class="small">Titta på en ledtråd, testa, och gå vidare.</text>
  <text x="55" y="675" class="small">Teknisk sanningskälla: E001-circuit.yaml + E001-manus.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#fffdf7"/>
<style>
.t{font-family:Arial, Helvetica, sans-serif}
.gpio{font-size:15px;font-weight:700;fill:#fff}
.label{font-size:15px;fill:#333}
.name{font-size:20px;font-weight:700}
</style>
<g transform="translate(70,155)">
  <rect x="0" y="0" width="250" height="700" rx="4" fill="#2e7250" stroke="#1b4b35" stroke-width="5"/>
  <rect x="78" y="55" width="88" height="62" rx="4" fill="#222"/>
  <text class="t" x="95" y="620" font-size="22" fill="#163827">ESP32</text>
  <rect x="215" y="35" width="110" height="40" rx="3" fill="#ff4a4a"/><text class="t gpio" x="235" y="61">GPIO 23</text>
  <rect x="215" y="190" width="110" height="40" rx="3" fill="#d6a300"/><text class="t gpio" x="235" y="216">GPIO 22</text>
  <rect x="215" y="345" width="110" height="40" rx="3" fill="#2f9b48"/><text class="t gpio" x="235" y="371">GPIO 21</text>
  <rect x="215" y="500" width="110" height="40" rx="3" fill="#2467c2"/><text class="t gpio" x="238" y="526">GPIO 19</text>
  <rect x="215" y="635" width="88" height="40" rx="3" fill="#222"/><text class="t gpio" x="241" y="661">GND</text>
</g>

<line x1="1225" y1="190" x2="1225" y2="815" stroke="#202020" stroke-width="8" stroke-linecap="round"/>
<line x1="373" y1="790" x2="1225" y2="790" stroke="#202020" stroke-width="8" stroke-linecap="round"/>
<text class="t" x="1160" y="835" font-size="17" fill="#222">gemensam GND</text>

<!-- Row helper: each signal wire ends at long leg x=530, short leg x=610, resistor starts at x=610 -->

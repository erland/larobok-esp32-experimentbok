  <line x1="610" y1="178" x2="610" y2="210" stroke="#666" stroke-width="7" stroke-linecap="round"/>
  <text class="t name" x="650" y="136" fill="#9d2323">LED 1</text>
  <text class="t label" x="530" y="241" text-anchor="middle">Långt ben</text>
  <text class="t label" x="610" y="241" text-anchor="middle">Kort ben</text>
  <line x1="610" y1="210" x2="770" y2="210" stroke="#666" stroke-width="7" stroke-linecap="round"/>
  <rect x="770" y="185" width="155" height="50" rx="12" fill="#d8b18b" stroke="#885f3c" stroke-width="4"/>

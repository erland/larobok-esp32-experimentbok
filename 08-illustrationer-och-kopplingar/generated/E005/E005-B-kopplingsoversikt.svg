<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#fffdf7"/>
  <style>
    .label{font-family:Arial, Helvetica, sans-serif;font-size:19px;fill:#333}
    .gpio{font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;fill:#fff}
  </style>

  <!-- ESP32 panel -->
  <g transform="translate(70,130)">
    <rect x="0" y="0" width="300" height="690" rx="16" fill="#2e7d57" stroke="#164732" stroke-width="6"/>
    <rect x="90" y="72" width="120" height="82" rx="8" fill="#1e1e1e"/>
    <text x="92" y="575" font-family="Arial, Helvetica, sans-serif" font-size="56" fill="#143b2a">ESP32</text>

    <!-- GPIO labels moved down to align with the conductor height through each LED/resistor row -->
    <rect x="250" y="212" width="205" height="58" rx="10" fill="#f6a623"/>
    <text class="gpio" x="288" y="251">GPIO 23</text>

    <rect x="250" y="505" width="205" height="58" rx="10" fill="#4aa3e8"/>
    <text class="gpio" x="288" y="544">GPIO 22</text>

    <rect x="170" y="620" width="136" height="62" rx="10" fill="#222"/>
    <text class="gpio" x="213" y="662">GND</text>
  </g>

  <!-- Common GND rail -->
  <line x1="370" y1="780" x2="1220" y2="780" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <line x1="1220" y1="250" x2="1220" y2="810" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <text x="1078" y="865" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#333">gemensam GND</text>

  <!-- Red path: horizontal from GPIO to bottom of long leg, aligned with short-leg/resistor wire -->
  <line x1="455" y1="370" x2="656" y2="370" stroke="#f6a623" stroke-width="8" stroke-linecap="round"/>
  <polygon points="656,370 632,357 632,383" fill="#f6a623"/>

  <g transform="translate(610,170)">
    <circle cx="65" cy="75" r="58" fill="#ff4d4d" stroke="#a92626" stroke-width="6"/>
    <path d="M28 80 C45 42, 86 42, 103 80" fill="none" stroke="#ffb4b4" stroke-width="10" stroke-linecap="round"/>
    <line x1="46" y1="132" x2="46" y2="200" stroke="#666" stroke-width="8" stroke-linecap="round"/>
    <line x1="84" y1="132" x2="84" y2="200" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="764" y="255" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b12525">Röd LED</text>
  <text class="label" x="540" y="394">Långt ben</text>
  <text class="label" x="684" y="394">Kort ben</text>

  <line x1="694" y1="370" x2="885" y2="370" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(885,330)">
    <rect x="0" y="0" width="170" height="80" rx="18" fill="#d8b18b" stroke="#9a6b41" stroke-width="5"/>
    <line x1="40" y1="12" x2="40" y2="68" stroke="#7b3f1d" stroke-width="6"/>
    <line x1="86" y1="12" x2="86" y2="68" stroke="#e33" stroke-width="6"/>
    <line x1="132" y1="12" x2="132" y2="68" stroke="#d4a017" stroke-width="6"/>
  </g>
  <line x1="1055" y1="370" x2="1220" y2="370" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  <text x="846" y="474" class="label">Motstånd 1 220–330 Ω</text>

  <!-- Blue path: horizontal from GPIO to bottom of long leg, aligned with short-leg/resistor wire -->
  <line x1="455" y1="663" x2="656" y2="663" stroke="#4aa3e8" stroke-width="8" stroke-linecap="round"/>
  <polygon points="656,663 632,650 632,676" fill="#4aa3e8"/>

  <g transform="translate(610,463)">
    <circle cx="65" cy="75" r="58" fill="#4fa3ff" stroke="#1e5f9e" stroke-width="6"/>
    <path d="M28 80 C45 42, 86 42, 103 80" fill="none" stroke="#bfe1ff" stroke-width="10" stroke-linecap="round"/>
    <line x1="46" y1="132" x2="46" y2="200" stroke="#666" stroke-width="8" stroke-linecap="round"/>
    <line x1="84" y1="132" x2="84" y2="200" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="764" y="548" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1e5f9e">Blå LED</text>
  <text class="label" x="540" y="687">Långt ben</text>
  <text class="label" x="684" y="687">Kort ben</text>

  <line x1="694" y1="663" x2="885" y2="663" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(885,623)">
    <rect x="0" y="0" width="170" height="80" rx="18" fill="#d8b18b" stroke="#9a6b41" stroke-width="5"/>
    <line x1="40" y1="12" x2="40" y2="68" stroke="#7b3f1d" stroke-width="6"/>
    <line x1="86" y1="12" x2="86" y2="68" stroke="#e33" stroke-width="6"/>
    <line x1="132" y1="12" x2="132" y2="68" stroke="#d4a017" stroke-width="6"/>
  </g>
  <line x1="1055" y1="663" x2="1220" y2="663" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  <text x="846" y="767" class="label">Motstånd 2 220–330 Ω</text>
</svg>

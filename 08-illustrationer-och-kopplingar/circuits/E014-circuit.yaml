experiment: E014
title: Humörlampan
purpose: Återanvänd RGB-LED-kopplingen och visa att färger kan få betydelse som humör eller status.
board:
  type: ESP32 DevKit
  logic_voltage: 3.3V
  selected_gpio:
    - GPIO23
    - GPIO22
    - GPIO21
components:
  - id: ESP32
    type: esp32-devkit
    role: microcontroller
  - id: RGB1
    type: rgb-led-common-cathode
    role: output
    channels:
      red: anode
      green: anode
      blue: anode
      common: cathode
  - id: R1
    type: resistor
    value: 220-330 Ω
    role: current_limit_red
  - id: R2
    type: resistor
    value: 220-330 Ω
    role: current_limit_green
  - id: R3
    type: resistor
    value: 220-330 Ω
    role: current_limit_blue
  - id: BB1
    type: breadboard
  - id: USB1
    type: usb-cable
connections:
  - from: ESP32.GPIO23
    to: R1.pin1
    description: Röd kanal styrs från GPIO23.
  - from: R1.pin2
    to: RGB1.red
    description: Motståndet för röd kanal går till det röda benet.
  - from: ESP32.GPIO22
    to: R2.pin1
    description: Grön kanal styrs från GPIO22.
  - from: R2.pin2
    to: RGB1.green
    description: Motståndet för grön kanal går till det gröna benet.
  - from: ESP32.GPIO21
    to: R3.pin1
    description: Blå kanal styrs från GPIO21.
  - from: R3.pin2
    to: RGB1.blue
    description: Motståndet för blå kanal går till det blå benet.
  - from: RGB1.common
    to: ESP32.GND
    description: RGB-LED:ens gemensamma ben går till GND.
canonical_paths:
  - ESP32.GPIO23 -> R1 -> RGB1.red -> RGB1.common -> ESP32.GND
  - ESP32.GPIO22 -> R2 -> RGB1.green -> RGB1.common -> ESP32.GND
  - ESP32.GPIO21 -> R3 -> RGB1.blue -> RGB1.common -> ESP32.GND
code:
  pin_constants:
    redPin: 23
    greenPin: 22
    bluePin: 21
  new_ideas:
    - färg som humör, läge eller status
    - funktionsnamn som beskriver betydelse
    - återanvändning av setColor
  named_colors:
    glad: [255, 180, 0]
    lugn: [0, 80, 255]
    fokus: [0, 180, 60]
    varning: [255, 0, 0]
    favorit: [160, 0, 255]
safety:
  - Varje färgkanal ska ha eget seriemotstånd.
  - Common cathode-ben går till GND i projektets standard.
  - Koppla helst med USB urdragen.
verification:
  - Kontrollera att kopplingen fungerar med E012/E013-koden innan E014 testas.
  - Testa röd/grön/blå var för sig om humörfärgerna ser fel ut.
  - Verifiera analogWrite mot vald ESP32/Arduino-version.
illustrations:

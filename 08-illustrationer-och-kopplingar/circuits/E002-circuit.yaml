experiment: E002
title: LED med egen rytm
purpose: Visa att samma koppling kan få nytt beteende genom ändrad kod.
board:
  type: ESP32 DevKit
  logic_voltage: 3.3V
  selected_gpio: GPIO23
components:
  - id: ESP32
    type: esp32-devkit
    role: microcontroller
  - id: LED1
    type: led
    color: red
    role: output
    polarity:
      anode: long_leg
      cathode: short_leg
  - id: R1
    type: resistor
    value: 220-330 ohm
    role: current_limit
  - id: BB1
    type: breadboard
  - id: USB1
    type: usb-cable
connections:
  - from: ESP32.GPIO23
    to: LED1.anode
    description: Signal från ESP32 till LED-lampans långa ben.
  - from: LED1.cathode
    to: R1.pin1
    description: LED-lampans korta ben går till motståndet.
  - from: R1.pin2
    to: ESP32.GND
    description: Motståndet går tillbaka till GND.
canonical_path: ESP32.GPIO23 -> LED1.anode -> LED1.cathode -> R1 -> ESP32.GND
code:
  pin_constant: ledPin
  pin_value: 23
  behavior: Två korta blink och en längre paus.
  rhythm:
    - state: HIGH
      duration_ms: 150
    - state: LOW
      duration_ms: 150
    - state: HIGH
      duration_ms: 150
    - state: LOW
      duration_ms: 700
safety:
  - LED ska alltid ha seriemotstånd.
  - Återanvänd koppling från E001 om den fungerade.
verification:
  - Kontrollera att kopplingen är identisk med E001.
  - Kontrollera att koden använder GPIO23.
  - Kontrollera att rytmen blink-blink-paus syns fysiskt.
illustrations:
  - id: E002-A
    type: same_circuit_new_code
    source: prompt_or_layout
  - id: E002-B
    type: breadboard_check
    source: wokwi_or_structured_svg
  - id: E002-C
    type: rhythm_timeline
    source: generated_svg
  - id: E002-D
    type: rhythm_comparison
    source: generated_svg
  - id: E002-E
    type: troubleshooting
    source: annotated_structured_svg

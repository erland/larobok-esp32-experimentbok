experiment: E016
title: Andande ljus
purpose: Skapa en mjuk andande LED-effekt genom att låta PWM-värdet räknas upp och ned.
board:
  type: ESP32 DevKit
  logic_voltage: 3.3V
  selected_gpio:
    - GPIO23
components:
  - id: ESP32
    type: esp32-devkit
    role: microcontroller
  - id: LED1
    type: led
    color: red
    role: output
    polarity:
      anode: long_leg
      cathode: short_leg
  - id: R1
    type: resistor
    value: 220-330 Ω
    role: current_limit
  - id: BB1
    type: breadboard
  - id: USB1
    type: usb-cable
connections:
  - from: ESP32.GPIO23
    to: LED1.anode
    description: Signal från ESP32 till LED-lampans långa ben.
  - from: LED1.cathode
    to: R1.pin1
    description: LED-lampans korta ben går till motståndet.
  - from: R1.pin2
    to: ESP32.GND
    description: Motståndet går tillbaka till GND.
canonical_paths:
  - ESP32.GPIO23 -> LED1.anode -> LED1.cathode -> R1 -> ESP32.GND
code:
  pin_constants:
    ledPin: 23
  new_ideas:
    - for-loop som räknar upp
    - for-loop som räknar ned
    - PWM-värde som förändras lite i taget
    - andande ljuseffekt
  loops:
    fade_up: "for (int value = 0; value <= 255; value = value + 5)"
    fade_down: "for (int value = 255; value >= 0; value = value - 5)"
safety:
  - LED ska ha seriemotstånd.
  - Koppla inte GPIO direkt till GND utan LED och motstånd i serie.
  - Koppla helst med USB urdragen.
verification:
  - Kontrollera att E015-koden fungerar innan E016 testas.
  - Kontrollera GPIO23 till LED långt ben.
  - Kontrollera LED kort ben till motstånd och motstånd till GND.
  - Verifiera analogWrite mot vald ESP32/Arduino-version.
illustrations:

experiment: E015
title: Dimbar LED
purpose: Isolera PWM-idén på en vanlig LED: ett värde mellan 0 och 255 styr ljusstyrkan.
board:
  type: ESP32 DevKit
  logic_voltage: 3.3V
  selected_gpio:
    - GPIO23
components:
  - id: ESP32
    type: esp32-devkit
    role: microcontroller
  - id: LED1
    type: led
    color: red
    role: output
    polarity:
      anode: long_leg
      cathode: short_leg
  - id: R1
    type: resistor
    value: 220-330 Ω
    role: current_limit
  - id: BB1
    type: breadboard
  - id: USB1
    type: usb-cable
connections:
  - from: ESP32.GPIO23
    to: LED1.anode
    description: Signal från ESP32 till LED-lampans långa ben.
  - from: LED1.cathode
    to: R1.pin1
    description: LED-lampans korta ben går till motståndet.
  - from: R1.pin2
    to: ESP32.GND
    description: Motståndet går tillbaka till GND.
canonical_paths:
  - ESP32.GPIO23 -> LED1.anode -> LED1.cathode -> R1 -> ESP32.GND
code:
  pin_constants:
    ledPin: 23
  new_ideas:
    - PWM på en enkel LED
    - analogWrite med värden 0-255
    - ljusstyrkenivåer
  levels:
    off: 0
    weak: 40
    medium: 140
    strong: 255
safety:
  - LED ska ha seriemotstånd.
  - Koppla inte GPIO direkt till GND utan LED och motstånd i serie.
  - Koppla helst med USB urdragen.
verification:
  - Kontrollera GPIO23 till LED långt ben.
  - Kontrollera LED kort ben till motstånd och motstånd till GND.
  - Verifiera analogWrite mot vald ESP32/Arduino-version.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6

      - name: Validate project
        run: python3 scripts/validate_project.py .

      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip \
            python3-venv \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
          python3 -m venv "${RUNNER_TEMP}/weasyprint-venv"
          "${RUNNER_TEMP}/weasyprint-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/weasyprint-venv/bin/python" -m pip install "weasyprint==62.3" "pydyf==0.11.0"
          "${RUNNER_TEMP}/weasyprint-venv/bin/python" - <<'PY'
          import weasyprint, pydyf
          print(f"WeasyPrint: {weasyprint.__version__}")
          print(f"pydyf: {pydyf.__version__}")
          PY

      - name: Build EPUB and PDF
        env:
          WEASYPRINT_BIN: ${{ runner.temp }}/weasyprint-venv/bin/weasyprint
        run: python3 scripts/build_book.py --output-dir "${RUNNER_TEMP}/book-dist"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${RUNNER_TEMP}"/book-dist/*.epub "${RUNNER_TEMP}"/book-dist/*.pdf --clobber
          else
            gh release create "${tag}" "${RUNNER_TEMP}"/book-dist/*.epub "${RUNNER_TEMP}"/book-dist/*.pdf               --title "${tag}"               --generate-notes
          fi
